# Site status. Change the value, commit and push.
#   live         the normal site
#   maintenance  every page shows a short "being updated" notice instead of its content
#   archive      every page shows a yellow notice at the top: the site is archived
# One page can have its own status: add "status: archive" (or maintenance)
# to the block at the top of that page's Markdown file.
status: live

# Optional. Leave empty to use the standard wording.
archive_message: ""
maintenance_message: ""

# Fonts not yet released. The site only carries a cut-down copy with the
# characters used in <specimen> and <inuse> on the site, and the tester cannot
# be typed in. Make the copy with scripts/subset_fonts.py. On release, remove
# the font from this list and put the full .woff2 in assets/fonts/.
preview_fonts:
  - chapakala19

# ARK kinds: the word written as "ark: <kind>" on a page, and the letter in the
# id it gets (ofdn-<letter>-000001). To add a kind, add a line with an unused
# letter.
# Never change or remove a letter once an id with it is published.
ark_kinds:
  film: f
  video: f
  audio: a
  resource: r
  tool: t
  typeface: y
  dataset: d
  document: r

# Languages that pages come in, by code (ISO 639), with the name the language
# has for itself and its English name. A language version of a page is a second file next to the
# original, named <slug>.<code>.md; see README.md, "Language versions".
languages:
  en: {own: English, english: English}
  sat: {own: ᱥᱟᱱᱛᱟᱲᱤ, english: Santali}
  or: {own: ଓଡ଼ିଆ, english: Odia}
