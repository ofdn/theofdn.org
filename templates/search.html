{% extends "base.html" %}
{% block title %}Search | {{ site_name }}{% endblock %}
{% block meta %}<meta name="robots" content="noindex">{% endblock %}
{% block content %}
<div class="page__wrap">
  <header class="page__header">
    <h1 class="page__title">Search</h1>
  </header>
  <form class="search-form search-form--page" role="search" action="/search/" method="get">
    <label for="search-page-q">Search films, podcasts, resources and publications</label>
    <div class="search-form__row">
      <input type="search" id="search-page-q" name="q" autocomplete="off">
      <button type="submit">Search</button>
    </div>
  </form>
  <p class="search-status" id="search-status" role="status" aria-live="polite"></p>
  <ol class="card-list search-results" id="search-results" role="list" data-index="/search.json"></ol>
  <noscript><p>Search needs JavaScript. You can browse <a href="/category/film/">films</a>, <a href="/category/oer/">resources</a> and <a href="/category/blogs/">publications</a> instead.</p></noscript>
</div>
{% endblock %}
